name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-and-bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked validation and PDF dependencies
        run: python -m pip install -r metawingman/references/dependencies/python-core.lock.txt -r metawingman/references/dependencies/python-pdf.lock.txt
      - name: Verify Python dependency locks
        run: python scripts/verify_dependency_locks.py --skip-r
      - name: Build deterministic skill bundles
        run: python scripts/build_skill_bundle.py
      - name: Verify release manifests
        run: |
          python scripts/verify_skill_bundle.py .agents/skills/metawingman
          python scripts/verify_skill_bundle.py plugins/metawingman/skills/metawingman
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Require identical generated payloads
        shell: python
        run: |
          import json
          from pathlib import Path

          left = json.loads(Path(".agents/skills/metawingman/release-manifest.json").read_text())
          right = json.loads(Path("plugins/metawingman/skills/metawingman/release-manifest.json").read_text())
          assert left["source_tree_sha256"] == right["source_tree_sha256"]
          assert left["files"] == right["files"]
      - name: Require committed bundles to be current
        run: git diff --exit-code -- .agents/skills/metawingman plugins/metawingman/skills/metawingman
      - name: Build release archive and metadata
        run: |
          python scripts/package_skill_release.py
          python scripts/generate_release_metadata.py
